version: 1

services:
  - type: web
    name: fisiosmart-web
    runtime: python
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
    disk:
      name: fisiosmart-data
      mountPath: /data
      sizeGB: 1
    plan: starter

  - type: worker
    name: fisiosmart-qcluster
    runtime: python
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "python manage.py qcluster"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: PYTHONUNBUFFERED
        value: "1"
    plan: starter

databases:
  - name: fisiosmart-postgres
    region: oregon
    plan: starter