{% extends "base.html" %}
{% load static %}

{% block extra_head %}
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <style>
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  </style>
{% endblock %}

{% block navbar %}
  {% include "partials/navbar.html" %}
{% endblock %}

{% block content %}
  <main class="min-h-screen bg-slate-50 p-6 md:p-8">
    <div class="max-w-6xl mx-auto">
      <header class="mb-5 flex items-end justify-between gap-4">
        <div>
          <h1 class="text-3xl font-bold text-slate-900">Agenda</h1>
          <p class="text-slate-500 mt-1">Visão semanal de atendimentos</p>
        </div>
        <div class="flex gap-2">
          <button id="fc-prev" class="px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-800 hover:bg-slate-50 transition text-sm">←</button>
          <button id="fc-today" class="px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-800 hover:bg-slate-50 transition text-sm">Hoje</button>
          <button id="fc-next" class="px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-800 hover:bg-slate-50 transition text-sm">→</button>
        </div>
      </header>

      <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
        <div id="calendar"></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');
      if (!calendarEl) return;

      const eventsUrl = '/usuarios/api/calendario/';

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridWeek',
        initialDate: new Date(),
        allDaySlot: false,
        slotMinTime: '07:00:00',
        slotMaxTime: '21:00:00',
        nowIndicator: true,
        firstDay: 1,
        locale: 'pt-br',
        headerToolbar: {
          left: 'prev,next',
          center: 'title',
          right: ''
        },
        buttonText: {
          today: 'Hoje'
        },
        height: 'auto',
        eventTimeFormat: { hour: '2-digit', minute: '2-digit', meridiem: false },
        events: {
          url: eventsUrl,
          failure: function() {
            alert('Não foi possível carregar a agenda.');
          },
          error: function() {
            alert('Erro ao carregar eventos da agenda.');
          }
        },
        eventDidMount: function(info) {
          // Styling extra leve mantendo Tailwind/tema do app
          info.el.style.borderRadius = '10px';
          info.el.style.border = '1px solid rgba(255,255,255,0.35)';
          info.el.style.boxShadow = '0 10px 28px rgba(2,6,23,0.08)';
        }
      });

      calendar.render();

      // Botões externos (compat com caso headerToolbar estiver sem right)
      const prevBtn = document.getElementById('fc-prev');
      const todayBtn = document.getElementById('fc-today');
      const nextBtn = document.getElementById('fc-next');

      if (prevBtn) prevBtn.addEventListener('click', () => calendar.prev());
      if (todayBtn) todayBtn.addEventListener('click', () => calendar.today());
      if (nextBtn) nextBtn.addEventListener('click', () => calendar.next());
    });
  </script>
{% endblock %}
